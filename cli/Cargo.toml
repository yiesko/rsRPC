[package]
name = "rsrpc-cli"
version = "0.32.0"
edition = "2024"
rust-version = "1.88"
authors = ["spikehd"]
description = "Alternative Discord RPC server CLI: game detection with bundled database, IPC/WebSocket transports and bridge"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "rich-presence", "rpc", "bridge", "cli"]
categories = ["command-line-utilities"]

[dependencies]
rsrpc = { path = "../lib" }
clap = { version = "4.6.6", features = ["derive", "std", "env", "help", "usage", "error-context"], default-features = false }
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "charset"] }
serde_json = "1.0"
ctrlc = "3.4"
