[package]
name = "rsrpc"
version = "0.32.1"
edition = "2024"
rust-version = "1.88"
authors = ["spikehd"]
description = "Alternative Discord RPC server library: process detection, IPC/WebSocket transports and an arRPC-compatible activity bridge"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/yiesko/rsRPC"
keywords = ["discord", "rich-presence", "rpc", "bridge", "gaming"]
categories = ["network-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.21"
rmp-serde = "1.3"
simple-websockets = { git = "https://github.com/SpikeHD/simple-websockets.git", branch = "master" }
chrono = "0.4"
interprocess = "2.2"
aho-corasick = "1.1"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "charset"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "multithread"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["namedpipeapi", "winbase", "heapapi"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "comparison"
harness = false
